name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        working-directory: backend
        run: ruff check app/ tests/

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` runs `tsc --noEmit` first, so type errors fail the build.
      - run: npm run build

      # The build output is committed to backend/app/static/app/ (it is the
      # artefact the Docker image ships). Fail if the committed bundle drifts
      # away from what the sources produce.
      - name: Check the committed bundle is up to date
        run: |
          if ! git diff --quiet -- ../backend/app/static/app; then
            echo "::error::backend/app/static/app is out of date — run 'npm run build' in frontend/ and commit the result"
            git --no-pager diff --stat -- ../backend/app/static/app
            exit 1
          fi

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config -q

  caddy:
    name: Caddyfile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A broken Caddyfile only shows up when the container starts, which is
      # exactly the failure mode this job exists to catch.
      - name: Adapt the Caddyfile
        run: |
          docker run --rm \
            -e SITE_ADDRESS=kb.example.test \
            -e Caddy_BasicAuth_Username=ci \
            -e Caddy_BasicAuth_Hash='$2a$14$ci' \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile > /dev/null
